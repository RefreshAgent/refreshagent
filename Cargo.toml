[package]
name = "refreshagent"
version = "0.1.2"
edition = "2021"
description = "Autonomous SEO worker using your local coding agent"
license = "Apache-2.0"
repository = "https://github.com/RefreshAgent/refreshagent"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
signal-hook = "0.3"
libc = "0.2"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

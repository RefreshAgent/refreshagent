name: Release binaries
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['Cargo.toml', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, tomllib, json
          version = tomllib.load(open('Cargo.toml','rb'))['package']['version']
          tag = 'v'+version
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Stable versions only'
          requested = os.environ.get('REQUESTED_TAG') or (os.environ['GITHUB_REF_NAME'] if os.environ['GITHUB_REF'].startswith('refs/tags/') else tag)
          assert requested == tag, 'Requested tag must match Cargo.toml'
          existing = subprocess.run(['gh','release','view',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--json','isDraft'],capture_output=True,text=True)
          needed = existing.returncode != 0 or json.loads(existing.stdout)['isDraft']
          commit = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'tag={tag}\ncommit={commit}\nneeded={str(needed).lower()}\n')
          PY
  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate release tag and version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, subprocess
          tag = os.environ['RELEASE_TAG']
          version = json.loads(subprocess.check_output(['cargo','metadata','--locked','--no-deps','--format-version','1']))['packages'][0]['version']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Only stable semantic version tags are released'
          assert tag == 'v'+version, 'Tag must match Cargo.toml'
          PY
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh -n install.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/refreshagent" "dist/refreshagent-$TARGET"
          "dist/refreshagent-$TARGET" --version
          python3 - <<'PY'
          import hashlib, os, pathlib
          path = pathlib.Path('dist') / ('refreshagent-'+os.environ['TARGET'])
          path.with_name(path.name+'.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish only after every platform succeeds
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --draft --title "RefreshAgent $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Refresh Homebrew formula
        shell: bash
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "$RELEASE_TAG" ]; then exit 0; fi
          python3 scripts/update_homebrew.py --tag "$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/refreshagent.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Homebrew formula to $RELEASE_TAG"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
